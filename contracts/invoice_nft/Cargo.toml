[package]
name = "invoice_nft"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "20.5"
# Pin derive_arbitrary to fix stellar-xdr compatibility
derive_arbitrary = "=1.3.2"

[dev-dependencies]
soroban-sdk = { version = "20.5", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true